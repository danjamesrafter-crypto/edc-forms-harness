/* ---- fix: ToolbarComboButton overflow chevron ----
   The ported Popover wraps its trigger in a position:relative span, so the absolutely positioned
   .fw-toolbar-combo-more chevron was placed beside the 50px button instead of on its edge
   (the source uses Radix, which adds no wrapper). Let the wrapper cover the combo box and pass
   pointer events through to the button beneath it; only the chevron and the open list stay clickable. */

.fw-toolbar-combo > .fw-popover-wrap > span { display: contents; }

.fw-toolbar-combo > .fw-popover-wrap .fw-popover { pointer-events: auto; }

/* ---- ToolbarComboButton menu control (Figma Viewer-3.0 · Menu Control, 104472-110998) ----
   The side trigger is a 10×40 strip centred on the 50px button, not a full-height 10×50 one. At rest the
   16px chevron sits 2px toward the button; on hover it slides to centre (50ms) over a vertical gradient
   that peaks at the middle, with a hairline on the button side. A selected (Focused) button uses the
   denser gradient. Chevron ink: typography-light at rest, typography-base on hover; sidebar-base (fixed navy) on a selected button. */
.fw-toolbar-combo-more-left, .fw-toolbar-combo-more-right { top: 5px; height: 40px; width: 10px; overflow: visible; }
.fw-toolbar-combo-more-left .fw-icon, .fw-toolbar-combo-more-right .fw-icon { transition: transform 50ms ease-out; color: var(--typography-light); }
.fw-toolbar-combo-more-left .fw-icon { transform: translateX(2px); }
.fw-toolbar-combo-more-right .fw-icon { transform: translateX(-2px); }
.fw-toolbar-combo-more-left:hover .fw-icon, .fw-toolbar-combo-more-right:hover .fw-icon { transform: translateX(0); color: var(--typography-base); }
.fw-toolbar-combo-more-left:hover, .fw-toolbar-combo-more-right:hover {

html,body,#root{height:100%;margin:0}
body{background:var(--page-shaded);color:var(--typography-base);font-family:var(--font-sans);overflow:hidden}
.ef-app{display:flex;height:100%}
.ef-app .fw-navbar{height:100%;max-height:none;flex-shrink:0}
.ef-col{flex:1;display:flex;flex-direction:column;min-width:0}
.ef-brand{display:flex;align-items:center;gap:10px;height:50px;padding:0 12px 0 19px;border-bottom:1px solid var(--separations-base);flex-shrink:0;overflow:hidden}
.ef-top{height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--card-background);border-bottom:1px solid var(--separations-base);flex-shrink:0}
.ef-crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.ef-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ef-top .ef-actions{flex-wrap:nowrap}
.ef-main{flex:1;overflow:auto}
.ef-wrap{padding:24px max(16px,2vw) 64px;max-width:1360px}
.ef-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ef-head-text{min-width:0;flex:1 1 420px;display:flex;flex-direction:column;gap:6px}
.ef-sub{max-width:76ch}
.ef-section{margin-top:24px}
.ef-section-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.ef-card>.fw-panel{flex:none}
.ef-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ef-stat{background:var(--card-background);border:1px solid var(--separations-border);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;min-width:0}
button.ef-stat{cursor:pointer}
button.ef-stat:hover{background:var(--primary-hover)}
.ef-stat-v{font-size:26px;font-weight:500;line-height:1.25;font-variant-numeric:tabular-nums}
.ef-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ef-grow{flex:1;min-width:0}
.ef-scroll{overflow-x:auto}
.ef-num{font-variant-numeric:tabular-nums}
.ef-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.ef-cellbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--typography-muted);font:inherit;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ef-cellbtn:hover{background:var(--primary-hover);color:var(--typography-base)}
.ef-cellbtn.none{color:var(--typography-light)}
.ef-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ef-legend span{display:inline-flex;gap:4px;align-items:center}
/* subject workspace */
.ef-subj{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.ef-formlist{padding:8px;display:flex;flex-direction:column;gap:2px}
.ef-formgroup{padding:10px 8px 4px}
.ef-gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--separations-base);border:1px solid var(--separations-base);border-radius:8px;overflow:hidden;margin-bottom:12px}
.ef-gate{background:var(--card-background);padding:8px 12px;display:flex;gap:8px;align-items:flex-start;min-width:0}
.ef-gate>div{min-width:0}
.ef-inst{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
/* CRF page */
.ef-crf{background:var(--card-background);border:1px solid var(--separations-border);border-radius:8px;overflow:hidden}
.ef-crf-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px;padding:14px 16px;background:var(--card-header);border-bottom:1px solid var(--separations-border)}
.ef-crf-head>div{min-width:0}
.ef-crf-title{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.ef-q{display:grid;grid-template-columns:30px minmax(160px,1fr) minmax(0,1.6fr) minmax(120px,auto);gap:12px;padding:10px 16px;border-top:1px solid var(--separations-base);align-items:start}
.ef-q:first-of-type{border-top:0}
.ef-q.dirty{background:var(--orange-hover)}
.ef-q-n{color:var(--typography-light);font-size:12px;padding-top:2px;font-variant-numeric:tabular-nums}
.ef-q-v{min-width:0;display:flex;flex-direction:column;gap:4px}
.ef-q-flags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center;min-height:22px}
.ef-val{font-size:14px;line-height:22px;color:var(--typography-base);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ef-val small{color:var(--typography-light);font-size:12px;margin-left:4px}
.ef-empty{color:var(--typography-light);font-size:13px;line-height:22px}
.ef-opts{display:flex;flex-wrap:wrap;gap:4px 14px}
.ef-ro .fw-radio-group{flex-wrap:wrap}
.ef-ro .fw-radio-disabled{opacity:1}
.ef-ro .fw-radio-disabled:has([aria-checked=false]){opacity:.5}
.ef-ro .fw-radio-label{margin:4px 8px 4px 0}
.ef-prov{display:flex;gap:6px 18px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--separations-border);background:var(--card-header)}
.ef-editbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--separations-border);background:var(--orange-hover)}
.ef-kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;margin:0}
.ef-kv dd{margin:0}
.ef-pad{padding:16px}
.ef-stack{display:flex;flex-direction:column;gap:12px}
.ef-diff{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:6px 12px;border:1px solid var(--separations-base);border-radius:8px;padding:10px 12px}
.ef-diff>*{min-width:0;overflow-wrap:anywhere}

}

  <${Section} title="API Calls" sub="Newest first. Shows field names only, never values."><${Card} padded=${false}><div className="ef-scroll"><${Table} dense rowKey="_k" rows=${H.calls.slice(0, 60).map((c, i) => ({ ...c, _k: i }))} columns=${[{ key: 'm', header: 'Method' }, { key: 'path', header: 'Path', render: r => html`<span className="ef-mono">${r.path}</span>` }, { key: 'status', header: 'Status', render: r => html`<${Tag} color=${r.ok ? 'green' : r.status === '…' ? 'slate' : 'red'} title=${r.status} />` }, { key: 'ms', header: 'ms', align: 'right' }, { key: 'sample', header: 'Fields', render: r => html`<span className="ef-mono">${r.sample}</span>` }]} /></div><//><//>

}

/* ---------- dialogs ---------- */
function Dialogs() {

    <${WrappedInput} title="Note" required=${d.reason === 'Other'} description="Goes on the audit record."><${TextArea} name="note" rows=${2} fullWidth value=${d.note} onChange=${v => { d.note = v; rerender(); }} /><//>`;
  const ready = d.reason && (d.reason !== 'Other' || (d.note || '').trim());

        s.info.edc.fw_edits = s.info.edc.fw_edits.filter(e => e !== prior);
        const e = { id: 'E-' + String(DB.changes.length + 2).padStart(4, '0'), subject: s.label, form: d.k, inst: d.inst, field: f.key, edc_value: edcv, fw_value: to, from, to, by: who, at, reason: d.reason, note: d.note };
        DB.changes.push(e); if (JSON.stringify(to ?? null) !== JSON.stringify(edcv ?? null)) s.info.edc.fw_edits.push(e); });
      S.edit = null; S.dialog = null; rerender(); Promise.all([saveSubject(s), saveProject()]).then(() => toast(`Saved ${ch.length} ${ch.length > 1 ? 'fields' : 'field'}`)).catch(e => { toast('Save failed', 'error'); refresh(); }); };
    return html`<${Dialog} title="Review Changes" icon="edit" width="small" onClose=${close} description=${s.label + ' · ' + label(s, d.k, d.inst) + '. The imported EDC value stays on record.'} actions=${html`<${Button} variant="outlined" color="slate" onClick=${close}>Cancel<//><${Button} disabled=${!ready} onClick=${save}>Save Change<//>`}>
      <div className="ef-stack"><div className="ef-diff"><${T} variant="h6" color="light">Field<//><${T} variant="h6" color="light">Now<//><${T} variant="h6" color="light">New<//>${ch.map(({ f, from, to }) => html`<${React.Fragment} key=${f.key}><${T} variant="h4">${f.label}<//><${T} variant="p2" color="muted">${fmtV(f, from)}<//><${T} variant="h4">${fmtV(f, to)}<//><//>`)}</div>${reasonForm}</div><//>`;
  }
  if (d.type === 'resolve') {
    const c = d.c, f = fieldOf(c.form, c.field), keep = d.how === 'keep', sx = subj(c.subject);
    const apply = () => { const e = editOf(sx, c.form, c.inst, c.field), r = rec(sx, c.form, c.inst), at = now(), who = role().who;
      if (keep) { if (e) e.edc_value = c.edc_new; if (r) r[c.field] = c.edc_new; } else { if (r) r[c.field] = c.edc_new; sx.info.edc.fw_edits = sx.info.edc.fw_edits.filter(x => x !== e); }
      Object.assign(c, { status: keep ? 'kept' : 'took', res_by: who, res_at: at, res_reason: d.reason });
      DB.changes.push({ id: 'E-' + String(DB.changes.length + 2).padStart(4, '0'), subject: c.subject, form: c.form, inst: c.inst, field: c.field, from: c.fw_value, to: keep ? c.fw_value : c.edc_new, by: who, at, reason: d.reason, note: (keep ? 'Kept Flywheel value over EDC ' + c.edc_new : 'Took EDC value') + (d.note ? '. ' + d.note : '') });
      S.dialog = null; rerender(); const box = FORMS[c.form].level === 'subject' ? null : (DB.sessions.find(z => z._id === c.inst) ? ['sessions', DB.sessions.find(z => z._id === c.inst)] : ['acquisitions', DB.acquisitions.find(a => a._id === c.inst)]); Promise.all([saveSubject(sx), box ? saveContainer(box[0], box[1]) : null, saveProject()]).then(() => toast(keep ? 'Kept Flywheel value' : 'Took EDC value')).catch(() => { toast('Save failed', 'error'); refresh(); }); };
    return html`<${Dialog} title=${keep ? 'Keep Flywheel Value' : 'Take EDC Value'} icon="git-merge" width="small" onClose=${close} description=${`${c.subject} · ${label(null, c.form, c.inst)} · ${f.label}: ${fmtV(f, keep ? c.fw_value : c.edc_new)} becomes the value.`} actions=${html`<${Button} variant="outlined" color="slate" onClick=${close}>Cancel<//><${Button} disabled=${!ready} onClick=${apply}>Resolve<//>`}><div className="ef-stack">${reasonForm}</div><//>`;
  }

    return html`<${Dialog} title=${f.label + ' History'} icon="clock-history" width="small" onClose=${close} description=${s.label + ' · ' + label(s, d.k, d.inst)} actions=${html`<${Button} variant="outlined" color="slate" onClick=${close}>Close<//>`}>
      <div className="ef-tl"><div><${T} variant="p3" color="muted">${s.info.edc.imported.slice(0, 16).replace('T', ' ')} UTC<//><div><${T} variant="h4">Imported: ${fmtV(f, first)}<//><${T} variant="p3" color="muted">${s.info.edc.source_file} row ${s.info.edc.row}<//></div><${Tag} color="slate" title="EDC" /></div>
      ${edits.map(x => html`<div key=${x.id}><${T} variant="p3" color="muted">${x.at}<//><div><${T} variant="h4">Edited: ${fmtV(f, x.to ?? x.fw_value)}<//><${T} variant="p3" color="muted">${x.by} · ${x.reason}${x.note ? ' · ' + x.note : ''}<//></div><${Tag} color="orange" title=${x.id} /></div>`)}</div><//>`;
  }
  if (d.type === 'query') {
    const F = FORMS[d.k], send = () => { DB.queries.push({ id: 'Q-0' + (152 + DB.queries.length), subject: s.label, form: d.k, inst: d.inst, field: d.field, text: d.text, by: role().who, status: 'Open', at: now().slice(0, 10) }); S.dialog = null; toast('Query logged in this page only', 'info'); };
    return html`<${Dialog} title="Raise Query" icon="message-question-checkmark" width="small" onClose=${close} description=${s.label + ' · ' + label(s, d.k, d.inst) + '. The site corrects the EDC and the fix arrives with the next import.'} actions=${html`<${Button} variant="outlined" color="slate" onClick=${close}>Cancel<//><${Button} disabled=${!d.field || !d.text.trim()} onClick=${send}>Raise Query<//>`}>
      <div className="ef-stack"><${WrappedInput} title="Field" required><${Select} name="qfield" fullWidth value=${d.field} placeholder="Choose a field" onChange=${v => { d.field = v; rerender(); }} aria-label="Field">${F.fields.filter(imported).map(f => html`<${SelectItem} key=${f.key} value=${f.key} title=${f.label} />`)}<//><//><${WrappedInput} title="Question" required><${TextArea} name="qtext" rows=${3} fullWidth value=${d.text} onChange=${v => { d.text = v; rerender(); }} /><//><${T} variant="p3" color="light">Queries V2 is planned for 2027. In the harness this stays in the page.<//></div><//>`;
  }
  if (d.type === 'remove') return html`<${Dialog} title="Remove EDC Data" icon="trash-delete" iconColor="red" width="small" onClose=${close} description=${'Deletes info.edc from every container in ' + PROJECT.label + ' on ' + H.site + '. Type REMOVE to confirm.'} actions=${html`<${Button} variant="outlined" color="slate" onClick=${close}>Cancel<//><${Button} color="red" disabled=${d.word !== 'REMOVE'} onClick=${removeAll}>Remove<//>`}><${TextInput} name="confirm" value=${d.word} fullWidth aria-label="Type REMOVE" onChange=${v => { d.word = v; rerender(); }} /><//>`;
  return null;
}

/* ---------- shell ---------- */
const NAV = [['Data', [['forms', 'form-metadata-element', 'Forms'], ['conflicts', 'warning-circle', 'Conflicts'], ['changes', 'clock-history', 'Change Log']]], ['Manage', [['import', 'upload', 'Import'], ['access', 'user-key', 'Access & Policy']]], ['Harness', [['embed', 'layout', 'Subject View Embed'], ['diag', 'blocks-code-test-checkmark', 'Diagnostics']]]];
function SideNav() {
  const c = S.navCollapsed, n = openConflicts().length, r = role();
  const groups = r.view ? NAV : NAV.slice(-1).map(g => [g[0], g[1].filter(i => i[0] === 'diag')]);
  return html`<${Navbar} collapsed=${c} ariaLabel="EDC Forms navigation">
    <div className="ef-brand"><${Icon} name="flywheel-mark-logo" color="primary" decorative />${!c && html`<${T} variant="h4">EDC Forms<//>`}</div>
    ${groups.map(([h, items], gi) => html`<${React.Fragment} key=${h}>${gi > 0 && html`<${NavbarDivider} />`}<${NavbarHeader}>${h}<//>${items.map(([id, icon, t]) => html`<${NavbarItem} key=${id} value=${id} icon=${icon} title=${t} selected=${S.view === id || (id === 'forms' && S.view === 'subject')} onClick=${() => go(id)} badge=${id === 'conflicts' && n ? html`<${Badge} value=${String(n)} color="orange" variant="static" />` : null} />`)}<//>`)}
    <${NavbarSpacer} /><${NavbarDivider} />
    <${NavbarItem} value="me" title=${r.display} description=${r.name} avatar=${html`<${Avatar} size="small" content="initial" initial=${r.display.split(/[ .]+/).map(x => x[0]).join('').slice(0, 2)} colorSeed=${r.who} />`} /><//>`;
}
const previewRoles = () => { const o = ['dm', 'viewer', 'reader']; return o.slice(o.indexOf(H.realRole)); };
function TopBar() {
  const title = (NAV.flatMap(g => g[1]).find(x => x[0] === S.view) || [, , S.sub])[2];
  return html`<header className="ef-top"><div className="ef-crumbs"><${IconButton} icon="menu-burger-handle" size="small" color="slate" aria-label="Toggle navigation" onClick=${() => { S.navCollapsed = !S.navCollapsed; rerender(); }} /><${T} variant="h3" color="light" className="ef-crumb">${PROJECT.label}<//><${Icon} name="chevron-forward" color="light" size="small" decorative className="ef-crumb" /><${T} variant="h3">${role().view ? title : 'EDC Forms'}<//></div>
    <div className="ef-actions"><${Tag} size="large" color=${H.writable ? 'green' : 'orange'} title=${'Live · ' + H.site + (H.writable ? '' : ' · Read Only')} /><${Select} name="role" size="compact" width=${170} value=${S.role} onChange=${v => { S.role = v; S.edit = null; S.dialog = null; rerender(); }} aria-label="Preview role">${previewRoles().map(k => html`<${SelectItem} key=${k} value=${k} title=${ROLES[k].name} />`)}<//>
      <${Tooltip} title=${S.dark ? 'Light mode' : 'Dark mode'} position="bottom"><${IconButton} icon="moon-night-mode" color="slate" selected=${S.dark} aria-label="Toggle dark mode" onClick=${() => { S.dark = !S.dark; document.documentElement.dataset.mode = S.dark ? 'dark' : 'light'; rerender(); }} /><//></div></header>`;
}
const PAGES = { forms: FormsPage, subject: SubjectPage, conflicts: ConflictsPage, changes: ChangesPage, import: ImportPage, access: AccessPage, embed: EmbedPage, diag: DiagPage };
function App() {
  const [, force] = React.useReducer(x => x + 1, 0); rerender = force;
  React.useEffect(() => {
    const mq = matchMedia('(max-width: 900px)'); const sync = () => { S.narrow = mq.matches; S.navCollapsed = mq.matches; force(); }; mq.addEventListener('change', sync); sync();
    const onHash = () => { const h = location.hash.slice(1); if (PAGES[h] && h !== S.view) go(h); }; addEventListener('hashchange', onHash);
    const onKey = e => { if (e.key === 'Escape' && S.dialog) { S.dialog = null; force(); } }; document.addEventListener('keydown', onKey);
    return () => { mq.removeEventListener('change', sync); removeEventListener('hashchange', onHash); document.removeEventListener('keydown', onKey); };
  }, []);
  const Page = PAGES[S.view] || FormsPage;
  return html`<div className="ef-app"><${SideNav} /><div className="ef-col"><${TopBar} /><main className="ef-main"><div className="ef-wrap">
    ${H.err ? html`<${AlertPanel} severity="error" title="Could Not Connect" description=${H.err} />` : H.loading ? html`<${T} variant="p2" color="muted">Loading ${H.site || 'site'}...<//>` : role().view || S.view === 'diag' ? html`<${Page} />` : html`<${Card}><${ContextLayout} icon="private-mode-protection-circle" title="Forms Hidden While Blinded" description="Clinical forms can reveal treatment or outcome, so blinded readers don't see them." /><//>`}
  </div></main></div><${Dialogs} />${S.toast && html`<${SnackbarContainer} align="center"><${Snackbar} key=${S.toast.id} title=${S.toast.title} severity=${S.toast.severity} showClose onClose=${() => { S.toast = null; rerender(); }} /><//>`}</div>`;
}

/* ---------- boot ---------- */
async function refresh() { try { const keep = S.sub; await loadAll(); S.sub = subj(keep) ? keep : (DB.subjects[0] || {}).label; } catch (e) { toast('Reload failed', 'error'); } rerender(); }
async function boot() {
  try {
    H.ext = await Flywheel.initExtension({ scope: 'ReadWrite', validateOrigin: o => /^https:\/\/[a-z0-9.-]+\.flywheel\.io$/.test(o) });
    try { H.site = new URL(document.referrer).host.split('.')[0]; } catch (_) { H.site = H.ext.params?.site || window.__FW_TEST_SITE || 'unknown'; }
    H.writable = WRITE_SITES.includes(H.site);
    H.user = await api('GET', '/users/self'); try { const r = await api('GET', '/roles'); H.roles = Array.isArray(r) ? r : (r.results || []); } catch (_) {}
    const c = H.ext.container || {}; H.pid = (c.container_type === 'project' ? c._id : null) || (c.parents && c.parents.project) || H.ext.params?.project; if (!H.pid) throw new Error('Launch from a file on the project. No project found in the launch context.');
    await loadAll();
    const uid = H.user._id || H.user.id, perm = (PROJECT.permissions || []).find(p => (p._id || p.id) === uid), ids = perm ? (perm.role_ids || []) : [], mine = H.roles.filter(r => ids.includes(r._id || r.id));
    H.myRoles = mine.map(r => r.label); H.admin = (H.user.roles || []).includes('site_admin') || !!H.user.root;
    const actions = mine.flatMap(r => r.actions || []), readers = H.ext.params?.readerRoles || [], isReader = H.myRoles.some(l => readers.includes(l) || /read/i.test(l));
    H.realRole = H.admin || actions.includes('containers_modify_metadata') ? 'dm' : isReader ? 'reader' : 'viewer'; S.role = H.realRole;
    const who = H.user.email || uid, nm = [H.user.firstname, H.user.lastname].filter(Boolean).join(' ') || who; Object.values(ROLES).forEach(r => { r.who = who; r.display = nm; });
    if (!H.writable) Object.assign(ROLES.dm, { edit: false, importer: false, resolve: false, setup: false });
    S.imp = blankImp(); S.sub = (DB.subjects[0] || {}).label; S.form = FORM_KEYS[0]; S.emb = FORM_KEYS[0];
    addEventListener('focus', () => { if (!S.edit && !S.dialog && S.imp.step === 0 && Date.now() - (H.t || 0) > 30000) { H.t = Date.now(); refresh(); } });
  } catch (e) { H.err = String(e && e.message || e); H.loading = false; }
  rerender();
}
document.addEventListener('pointerdown', () => { if (H.ext && !S.fs && !document.fullscreenElement) { S.fs = 1; document.documentElement.requestFullscreen?.().catch(() => {}); } });
document.documentElement.dataset.mode = 'dark';
{ const h = location.hash.slice(1); if (PAGES[h]) S.view = h; }
S.imp = blankImp(); window.__ef = { S, DB, H };
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
boot();

</script></body></html>
